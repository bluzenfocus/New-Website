<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — Bluzen</title>
  <meta name="description" content="The page you're looking for doesn't exist." />

  <!-- Google Font: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind via CDN -->
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            colors: { bluzen: '#64DED4' }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05070a;
      color: #e6f0f2;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 0 1rem; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <main class="container py-12 text-center">
    <div class="mb-6">
      <img src="assets/logo.svg" alt="Bluzen logo" class="h-16 w-16 mx-auto rounded-xl border border-bluzen/60 bg-bluzen/10">
    </div>
    <h1 class="text-4xl md:text-5xl font-bold mb-4">404</h1>
    <p class="text-xl md:text-2xl text-white/80 mb-2">Page not found</p>
    <p class="text-white/60 mb-8">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="index.html" class="inline-block px-6 py-3 rounded-xl bg-bluzen text-black font-semibold hover:opacity-90 transition">
      Back to Home
    </a>
  </main>

</body>
</html>
